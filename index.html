<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Paper Trading Bot</title>

<style>
body{
background:#0d1117;
color:white;
font-family:Arial;
padding:20px;
}
.card{
background:#161b22;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
.green{color:#00ff88;}
.red{color:#ff5555;}
#log{
height:300px;
overflow:auto;
background:black;
padding:10px;
border-radius:10px;
font-size:13px;
}
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<h2>🤖 Bitcoin Paper Trading Bot</h2>

<div class="card">
Harga BTCUSDT:
<h1 id="price">Loading...</h1>
</div>

<div class="card">
Saldo Virtual:
<h2 id="balance">100000</h2>
</div>

<div class="card">
Posisi:
<h2 id="position">NONE</h2>
</div>

<div class="card">
Status:
<h3 id="status">Starting...</h3>
</div>

<div class="card">
<h3>Log Trading</h3>
<div id="log"></div>
</div>

<script>

let balance=100000;
let position=null;
let entry=0;
let sl=0;
let tp=0;

let lastPrice=null;

function log(msg){
document.getElementById("log").innerHTML=
new Date().toLocaleTimeString()+" - "+msg+"<br>"+
document.getElementById("log").innerHTML;
}

async function getPrice(){

try{

const res=await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
);

const data=await res.json();

const price=parseFloat(data.price);

document.getElementById("price").innerText=
"$"+price.toLocaleString();

document.getElementById("status").innerHTML=
"<span class='green'>ONLINE</span>";

if(lastPrice){

let change=((price-lastPrice)/lastPrice)*100;

if(position===null){

if(change>0.10){

position="BUY";
entry=price;
sl=price*0.98;
tp=price*1.04;

document.getElementById("position").innerText="BUY";

log(
"<span class='green'>BUY @ "+price+"</span>"
);

}

}

if(position==="BUY"){

if(price>=tp){

let profit=balance*0.04;

balance+=profit;

document.getElementById("balance").innerText=
Math.round(balance);

log(
"<span class='green'>TAKE PROFIT +"+Math.round(profit)+"</span>"
);

position=null;

}

else if(price<=sl){

let loss=balance*0.02;

balance-=loss;

document.getElementById("balance").innerText=
Math.round(balance);

log(
"<span class='red'>STOP LOSS -"+Math.round(loss)+"</span>"
);

position=null;

}

}

}

lastPrice=price;

}catch(e){

document.getElementById("status").innerHTML=
"<span class='red'>API ERROR</span>";

console.log(e);

}

}

getPrice();
setInterval(getPrice,10000);

</script>

</body>
</html>
